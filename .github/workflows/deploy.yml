name: Deploy

on:
  push:
    branches:
      - main
  # Pull requests are checked but NOT deployed. This is the safety net:
  # a broken change shows a red X on the PR instead of going live.
  pull_request:
    branches:
      - main
  # Callable by sync-content.yml. A commit pushed with GITHUB_TOKEN does not
  # trigger the `push` event above — GitHub blocks that to prevent workflows
  # looping — so the content sync has to ask for the deploy explicitly. Without
  # this the sync would commit content that never reached the site, which looks
  # exactly like "the sync stopped working".
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to build. Defaults to whatever triggered the run.
        type: string
        required: false
        default: ''

# Deploys to the same branch must not overlap. Two runs building different
# commits publish whichever finishes last, so an older build can overwrite a
# newer one — and because the content sync only deploys when content *changed*,
# nothing would come along to correct it. Queue, never cancel.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # The sync passes `main` so the build includes the content commit it
          # just pushed. A scheduled run's default SHA predates that commit, so
          # taking the default here would deploy the *old* content and report
          # success. Empty means "use the default", which is right everywhere
          # else.
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Pinned deliberately. Without this, the build silently follows
          # whatever Node the runner happens to ship and can break with no
          # change to this repository.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run tests
        # Includes the WebKit/iOS project, which cannot run on every
        # developer machine but does run here on every change.
        run: npm run test:all

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build project
        run: npm run build

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # PR runs stop after `build`; everything else that got this far is a change
    # already on main — a direct push, or the content sync calling in. Note
    # `github.event_name` inside a called workflow is the *caller's* event, so
    # this cannot test for 'push' specifically.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
