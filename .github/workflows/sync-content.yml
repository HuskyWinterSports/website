name: Sync content from Google

# Pulls the club's published Google Doc, regenerates content/*.json, and — only
# if something actually changed — commits it and rebuilds the site.
#
# No credential is involved. The document is read over "Publish to the web",
# which needs no token, so there is nothing here that expires when an officer
# graduates. See docs/content-sync-spec.md.

on:
  schedule:
    # Hourly, at :17 rather than :00 — GitHub's scheduler is heavily contended
    # on the hour and delays runs by up to 20 minutes.
    - cron: '17 * * * *'
  # The "update now" button, for when an officer does not want to wait an hour.
  # Actions tab -> Sync content from Google -> Run workflow.
  workflow_dispatch:
  # Reserved for the optional Apps Script accelerator described in the spec.
  # Adding it later needs no change here.
  repository_dispatch:
    types: [content-updated]

# Never let two syncs race each other into a push conflict. Queue, don't cancel:
# a cancelled sync looks identical to one with nothing to do.
concurrency:
  group: content-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Pull from Google
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      pages: ${{ steps.commit.outputs.pages }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Full history: this job rebases onto main before pushing, and a
          # rebase in the default shallow clone can fail if main has moved on.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull the latest content from Google
        run: |
          set -o pipefail
          npm run sync 2>&1 | tee sync.log

      - name: Explain the failure in plain language
        if: failure()
        # The error text is written for an officer, not a developer, but it is
        # buried in a log by default. The run summary is the first thing shown
        # when someone opens a failed run, and it is what the email watcher
        # described in spec 7.2 can quote.
        run: |
          {
            echo '## The website could not be updated'
            echo
            echo 'The site is unchanged and still shows the previous version.'
            echo
            echo '```'
            cat sync.log 2>/dev/null || echo '(the sync failed before producing any output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Nothing below publishes a change the first time it is seen.
      #
      # Google republishes a document as it is typed, so a scheduled run can
      # arrive mid-edit. A half-finished sentence is structurally perfect —
      # no validation can ever reject it — so it would go live and sit there.
      #
      # So a change must be seen TWICE, an hour apart, before it is published.
      # The identity of the content is its own cache key: saving that key says
      # "seen", and finding it on a later run says "still saying the same
      # thing an hour later, so whoever was typing has stopped."
      #
      # Manually running the workflow skips the wait, because pressing the
      # button is itself the statement that the text is ready.
      # ------------------------------------------------------------------
      - name: Identify what the document is currently saying
        id: candidate
        run: |
          if git diff --quiet -- content/; then
            echo 'Nothing changed. Not committing, not deploying.'
            echo 'state=unchanged' >> "$GITHUB_OUTPUT"
          else
            echo "hash=$(cat content/*.json | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
            echo 'state=new' >> "$GITHUB_OUTPUT"
          fi

      - name: Have we seen this exact text before?
        id: seen
        if: steps.candidate.outputs.state == 'new'
        uses: actions/cache/restore@v4
        with:
          path: .content-candidate
          key: content-candidate-${{ steps.candidate.outputs.hash }}

      - name: Remember it, and wait for it to settle
        if: steps.candidate.outputs.state == 'new' && steps.seen.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          date -u > .content-candidate
          {
            echo '## Change seen — waiting to confirm it is finished'
            echo
            echo 'The document has changed. The website has NOT been updated yet.'
            echo
            echo 'It updates once the same text is still there an hour from now,'
            echo 'so that an edit caught halfway through does not go public.'
            echo
            echo 'To publish immediately instead, run this workflow by hand.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the candidate
        if: steps.candidate.outputs.state == 'new' && steps.seen.outputs.cache-hit != 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .content-candidate
          key: content-candidate-${{ steps.candidate.outputs.hash }}

      - name: Commit the change, if there is one
        id: commit
        if: |
          steps.candidate.outputs.state == 'new' &&
          (steps.seen.outputs.cache-hit == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          # `paste -d` takes a cyclic list of single characters, so ', ' would
          # alternate the two and produce "a,b c". Join, then space out.
          PAGES=$(git diff --name-only -- content/ \
            | xargs -n1 basename \
            | sed 's/\.json$//' \
            | sort \
            | paste -sd, - \
            | sed 's/,/, /g')
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/
          git commit \
            -m "Update content: $PAGES" \
            -m 'Pulled from the club Google Doc by the scheduled sync.'

          # main may have moved while Google was being fetched. Rebase rather
          # than force: the generated file is the only thing this job touches.
          git pull --rebase origin main
          git push origin HEAD:main

          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Record what happened
        if: always()
        run: |
          if [ '${{ steps.commit.outputs.changed }}' = 'true' ]; then
            echo "## Updated: ${{ steps.commit.outputs.pages }}" >> "$GITHUB_STEP_SUMMARY"
            echo 'The site is rebuilding now and will be live in a few minutes.' >> "$GITHUB_STEP_SUMMARY"
          elif [ '${{ job.status }}' != 'success' ]; then
            : # the failure step above has already written the explanation
          elif [ '${{ steps.candidate.outputs.state }}' = 'new' ]; then
            : # the waiting-to-settle step has already written the explanation
          elif [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo '## No changes to the document' >> "$GITHUB_STEP_SUMMARY"
            echo 'It already matches the website. Rebuilding and republishing anyway, since this run was started by hand.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## No changes' >> "$GITHUB_STEP_SUMMARY"
            echo 'The document matches what the website is already showing.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build and deploy the update
    needs: sync
    # "Content changed" is the normal reason to deploy. `workflow_dispatch` also
    # deploys unconditionally, because otherwise a transient deploy failure is
    # unrecoverable: the content commit is already on main, so every later run
    # regenerates identical JSON, sees no diff, skips the deploy, and reports
    # success — green forever, stale forever, with no button to press. This
    # makes "update now" double as "rebuild and republish".
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    # Runs the ordinary pipeline — lint, the full browser suite on Chromium and
    # WebKit, build, publish — so content that breaks a page is caught before it
    # reaches visitors, exactly as a developer's change would be.
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    permissions:
      contents: write
